name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.5, PostgreSQL 18, Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trophyvault
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trophyvault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trophyvault -d trophyvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: trophyvault_test
      DB_USERNAME: trophyvault
      DB_PASSWORD: ci-only-password
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, redis, pcntl, posix, intl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate throwaway APP_KEY
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (PHPStan / Larastan)
        run: composer analyse

      - name: Tests (PHPUnit against PostgreSQL + Redis)
        run: composer test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  docs:
    name: Repository checks (docs, CI/compose safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Links and anchors
        run: python3 scripts/check-docs.py

      - name: CI and compose safety (no dev database, no exposed data services)
        run: python3 scripts/check-ci.py && python3 scripts/check-ci.py --selftest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mermaid syntax
        run: |
          mkdir "$RUNNER_TEMP/mermaid" && cd "$RUNNER_TEMP/mermaid"
          npm init -y >/dev/null
          npm i mermaid@12 jsdom@30 --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/scripts/check-mermaid.mjs" .
          node check-mermaid.mjs "$GITHUB_WORKSPACE"

  stack:
    name: Docker stack (config, healthchecks, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with generated secrets
        run: |
          sh scripts/setup.sh
          # Any free port works on the runner; keep it distinct from the local default.
          sed -i 's/^APP_PORT=.*/APP_PORT=18190/' .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images and install backend dependencies
        run: |
          docker compose build
          docker compose run --rm --no-deps app composer install --no-interaction --no-progress

      - name: Start stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 240

      - name: Migrate and smoke test
        run: |
          docker compose exec -T app php artisan migrate --force
          sh scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
