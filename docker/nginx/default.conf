# Single entrypoint for the development stack.
#   /api, /up, /horizon, /vendor/horizon -> Laravel (PHP-FPM)
#   everything else                      -> Vite dev server (incl. HMR websocket)
upstream php_app {
    server app:9000;
}

upstream vite_dev {
    server frontend:5173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;

    location ~ ^/(api|up|horizon|vendor/horizon)(/|$) {
        include fastcgi_params;
        fastcgi_pass php_app;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location / {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
