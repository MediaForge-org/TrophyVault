# TrophyVault development stack. Not a production deployment.
# Only the "web" service is published on the host (127.0.0.1:${APP_PORT}); PostgreSQL and Redis
# are reachable from other containers only.

name: trophyvault

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: trophyvault-php:dev
  env_file: .env
  environment:
    # Compose-level values win over .env so that the services always talk to the internal hostnames.
    DB_HOST: postgres
    REDIS_HOST: redis
  volumes:
    - ./backend:/var/www/html
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    image: nginx:1-alpine
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set in .env}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    networks: [backend, frontend]
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    <<: *php
    # Vendor install and migrations are explicit steps (make install / make migrate), not hidden in start-up.
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000);exit($$s?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    # Fails (and restarts) until vendor/ has been installed via `make install`.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: trophyvault-node:dev
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment:
      HOME: /tmp
      # Bind mounts from some file systems (e.g. NTFS, network shares) do not emit change events.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (run scripts/setup.sh)}
    volumes:
      # PostgreSQL 18 images keep versioned data below /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (run scripts/setup.sh)}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  backend:
  frontend:

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
